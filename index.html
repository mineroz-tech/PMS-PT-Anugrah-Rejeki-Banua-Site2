<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Plant Management System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('pms_theme')==='light'?'light':'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<style>
:root{color-scheme:dark;--bg:#0d0d0e;--p:#17181a;--p2:#202225;--bd:#2d3033;--tx:#f2f2f0;--mt:#9a9da1;--am:#ffb400;--ok:#3ecf72;--er:#ff5a4d;--bl:#4aa3ff;--hv:#1b1c1e;--st:rgba(255,255,255,.025);--st2:rgba(255,255,255,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html[data-theme="light"]{color-scheme:light;--bg:#f2f4f7;--p:#ffffff;--p2:#e9ecf0;--bd:#d3d8de;--tx:#16191d;--mt:#5b636d;--am:#b87400;--ok:#188a42;--er:#d23a2d;--bl:#1d6fc4;--hv:#eef1f5;--st:rgba(0,0,0,.03);--st2:rgba(0,0,0,.06)}
html[data-theme="light"] .WAITING,html[data-theme="light"] .High{color:#c9560a}html[data-theme="light"] .TESTING{color:#8e3fd1}html[data-theme="light"] #sb a em{color:#8a929b}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;height:100%}
#sb{width:230px;background:var(--p);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:.2s;overflow-y:auto;flex:none}
.brand{padding:14px;font-weight:800;color:var(--am);letter-spacing:.5px;border-bottom:1px solid var(--bd);white-space:nowrap}
.brand small{display:block;color:var(--mt);font-weight:400;font-size:10px;letter-spacing:0}
#sb a{display:flex;gap:10px;padding:10px 14px;color:var(--mt);text-decoration:none;border-left:3px solid transparent;white-space:nowrap}
#sb a:hover{background:var(--p2);color:var(--tx)}#sb a.on{color:var(--am);border-color:var(--am);background:var(--p2)}
#sb a i{font-style:normal;width:18px;text-align:center}#sb a em{font-size:9px;margin-left:auto;color:#666;font-style:normal}
body.col #sb{width:56px}body.col #sb span,body.col #sb em,body.col .brand small,body.col .brand b{display:none}
#mn{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--p);border-bottom:1px solid var(--bd)}
#top h1{font-size:16px;margin:0;flex:1;min-width:120px}#pf{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mt)}#pf select,#pf input{width:auto;padding:4px 6px;font-size:12px}#pf.on{outline:1px solid var(--am);border-radius:8px;padding:3px 6px}#pf button{padding:3px 8px}#clock{color:var(--mt);font-size:12px}
#ct{flex:1;overflow:auto;padding:16px}
button,.btn{background:var(--am);color:#111;border:0;border-radius:6px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px}
button.g{background:var(--p2);color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--er);color:#fff}button.s{padding:4px 9px;font-size:12px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px;font:inherit;width:100%}
input:focus,select:focus{outline:1px solid var(--am)}input[readonly]{opacity:.6}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--p);border:1px solid var(--bd);border-top:3px solid var(--am);border-radius:8px;padding:12px}
.k small{color:var(--mt);text-transform:uppercase;font-size:11px}.k b{display:block;font-size:24px;margin-top:4px}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:16px}
.cd{background:var(--p);border:1px solid var(--bd);border-radius:8px;padding:14px}.cd h3{margin:0 0 10px;font-size:13px;color:var(--mt);text-transform:uppercase}
.cd canvas{max-height:240px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tb input,.tb select{width:auto;flex:1;min-width:130px}
.tw{overflow-x:auto;background:var(--p);border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mt);font-size:11px;text-transform:uppercase;cursor:pointer;background:var(--p2)}tr:hover td{background:var(--hv)}
.bg{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--p2)}
.RUNNING{color:var(--ok)}.STANDBY{color:var(--bl)}.BREAKDOWN{color:var(--er)}.PM,.PDM{color:var(--am)}.DISPOSED{color:#777}.HM{color:var(--am)}.KM{color:var(--bl)}
.pg{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mt)}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#md{background:var(--p);border:1px solid var(--bd);border-radius:10px;width:min(760px,100%);max-height:92%;overflow:auto;padding:18px}
#md h2{margin:0 0 12px;color:var(--am);font-size:16px}.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{font-size:11px;color:var(--mt);display:block;margin-bottom:3px}.ac{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#ts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:60}
.t{background:var(--p2);border-left:4px solid var(--ok);padding:10px 14px;border-radius:6px;box-shadow:0 4px 14px #0008}.t.e{border-color:var(--er)}
.pb{height:8px;background:var(--p2);border-radius:9px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--am)}
.ph{text-align:center;padding:50px 20px;color:var(--mt)}.ph b{color:var(--am);font-size:18px;display:block;margin-bottom:6px}
.GREEN{color:var(--ok)}.YELLOW{color:var(--am)}.RED{color:var(--er)}.DONE{color:var(--mt)}.OPEN{color:var(--bl)}.IN{color:var(--am)}.WAITING{color:#ff8c42}.REPAIR{color:var(--er)}.TESTING{color:#c77dff}.COMPLETED,.CLOSED{color:var(--ok)}.Emergency{color:var(--er)}.High{color:#ff8c42}.Medium{color:var(--am)}.Low{color:var(--ok)}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}.kc{flex:0 0 230px;background:var(--p);border:1px solid var(--bd);border-radius:8px;padding:8px;min-height:220px}.kc h4{margin:0 0 8px;font-size:12px;color:var(--am);display:flex;justify-content:space-between}.kc.ov{outline:2px dashed var(--am)}
.kd{background:var(--p2);border:1px solid var(--bd);border-left:3px solid var(--am);border-radius:6px;padding:8px;margin-bottom:8px;cursor:grab;font-size:12px}.kd b{display:block}.kd .r{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.tl{border-left:2px solid var(--am);margin-left:8px;padding-left:18px}.te{position:relative;margin-bottom:14px}.te:before{content:"";position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--am)}.te small{color:var(--mt)}
.ch{display:inline-block;padding:3px 8px;margin:2px;border-radius:99px;font-size:11px;background:var(--p2);color:var(--mt)}.ch.on{background:var(--am);color:#111;font-weight:700}.NORMAL,.ACTIVE{color:var(--ok)}.WARNING{color:var(--am)}.CRITICAL,.FAILED{color:var(--er)}.REMOVED{color:#aaa}.BLUE{color:var(--bl)}.WATCH{color:#ff8c42}.RECEIVED{color:var(--ok)}.CANCELLED{color:#aaa}
#bell{padding:4px 10px;border-radius:99px;font-weight:700;font-size:12px;text-decoration:none;background:var(--p2);color:var(--mt)}
.al{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--p);border:1px solid var(--bd);border-left:4px solid var(--mt);border-radius:8px;padding:10px;margin-bottom:8px}.al .b{flex:1;min-width:220px}.al.R{border-left-color:var(--er)}.al.Y{border-left-color:var(--am)}.al.B{border-left-color:var(--bl)}
#top .sv,.sv{font-size:11px;padding:3px 8px;border-radius:99px;cursor:pointer;background:var(--p2);white-space:nowrap;font-weight:700}.sv.saved{color:var(--ok)}.sv.saving{color:var(--am)}.sv.error{background:var(--er);color:#fff}.sv small{color:var(--mt);font-weight:400}@media(max-width:800px){.sv small{display:none}}
@media print{html,body,#app,#mn,#ct{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}#sb,#top,.noprint,#ts,#ov{display:none!important}#ct{padding:0!important}#rp-out,#rp-out *{color:#000!important;background:#fff!important;border-color:#999!important;white-space:normal!important}#rp-out{border:0!important;padding:0!important}#rp-out th{background:#eee!important}#rp-out table{min-width:0!important;font-size:11px}.tw{border:0!important;overflow:visible!important}}
@media(max-width:800px){#sb{position:fixed;z-index:40;height:100%;left:-240px;width:230px}body.op #sb{left:0}body.col #sb{width:230px}body.col #sb span,body.col #sb em,body.col .brand b{display:inline}}
.inv{width:100%;border-collapse:collapse;min-width:0;color:var(--tx)}.inv th,.inv td{border:0;border-bottom:1px solid var(--bd);padding:10px 12px;text-align:center;white-space:nowrap;cursor:default;color:var(--tx);background:transparent}.inv td.l{text-align:left}
.inv.sm th{background:var(--p2);color:var(--am);font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;border-bottom:2px solid var(--am);padding:12px}
.inv.sm td{font-size:14px;font-weight:600}.inv.sm td:first-child{color:var(--mt)}.inv.sm td:nth-child(2){font-weight:800}.inv.sm td:nth-child(5){color:var(--am);font-weight:800}
.inv.sm tr:nth-child(even) td{background:var(--st)}.inv.sm tr:hover td{background:var(--hv)}.inv.sm td button{padding:4px 14px}
.inv.sm tr.tt td{background:var(--p2);font-weight:800;color:var(--am);border-top:2px solid var(--am)}
.inv.dt th{background:var(--p2);color:var(--am);font-size:11px;letter-spacing:.07em;padding:7px 8px;border:1px solid var(--bd);border-bottom:2px solid var(--am)}
.inv.dt td{font-size:12px;padding:3px 8px;border:1px solid var(--bd)}.inv.dt td.l{color:var(--mt)}.inv.dt td.dd{width:105px;font-weight:700;background:var(--st)}
.inv.dt td.DS{color:var(--am);font-weight:700}.inv.dt td.NS{color:var(--bl);font-weight:700}.inv.dt td.on{color:var(--ok);font-weight:800}.inv.dt td.z{color:var(--mt)}
.inv.dt tr:hover td{background:var(--hv)}.inv.dt tr:hover td.dd{background:var(--st2)}
.inv.dt tr.tt td{background:var(--p2);font-weight:800;color:var(--am);border-top:2px solid var(--am)}.inv.dt td.kv{background:rgba(255,180,0,.08);color:var(--am);font-weight:800;font-size:14px}.inv.dt td.kl{font-weight:800;width:50px}

// --- Utilitas hash & metadata
function syH(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36).padStart(11,'0').slice(0,8)}

  for(const r of arr){if(!r||r.id==null)continue;cur.add(String(r.id));const h=syHashOf(r);

  if(M.tomb[k])for(const id of cur)if(M.tomb[k][id]!==undefined)delete M.tomb[k][id];
  SY.ids[k]=cur;SY.dirty[k]=dirty}

function syDetectSet(){const M=syMeta(),now=syNow(),S=APP_STATE.settings||{};SY.sdirty=[];
 for(const key of Object.keys(S)){if(SY_SKIP.has(key))continue;const h=syH(syStr(S[key])),e=M.st[key]||(M.st[key]={});if(e.h!==h){if(e.k!==h){e.k=h;e.u=Math.max(now,(e.u||0)+1)}SY.sdirty.push({id:key,v:S[key],_u:e.u,h})}}}

  if(a.set!==undefined){const e=M.st[a.set];if(e&&e.k===a.h||e&&syH(syStr((APP_STATE.settings||{})[a.set]))===a.h){e.h=a.h;delete e.k}continue}

// --- Gabung perubahan dari server ke data lokal (di tempat, agar referensi objek tetap)
function syMerge(ch){const M=syMeta();
 for(const k in ch){const inc=ch[k];if(!inc||!inc.length)continue;
  if(k==='settings'){syMergeSet(inc);continue}
  if(!APP_STATE[k])APP_STATE[k]=[];const arr=APP_STATE[k],map=new Map(),ids=SY.ids[k]||(SY.ids[k]=new Set()),tb=M.tomb[k]||{},del=new Set(),seqFn=SY_SEQ[k];

  for(const rec of inc){const id=String(rec.id),i=map.get(id),loc=i===undefined?null:arr[i],ru=rec._u||0;
   if(rec._d){if(loc&&ru>=(loc._u||0)){del.add(id);ids.delete(id);SY.chg++}if(tb[id]!==undefined)delete tb[id];continue}

   if(lh===rh){loc._u=ru;loc._h=lh;delete loc._k;if(rec._c===undefined)delete loc._c;else loc._c=rec._c;continue}

 for(const rec of inc){if(rec._d||SY_SKIP.has(rec.id))continue;const key=rec.id,e=M.st[key]||(M.st[key]={}),rh=syH(syStr(rec.v)),has=Object.prototype.hasOwnProperty.call(S,key),lh=has?syH(syStr(S[key])):undefined;

// Nomor WO/PO bentrok: ganti nomor lokal (setelah semua data server tergabung) dan perbarui referensi yang saya buat sendiri

const idbOpen=()=>new Promise((res,rej)=>{if(typeof indexedDB==='undefined'||!indexedDB)return rej(new Error('IndexedDB tidak tersedia'));let r;try{r=indexedDB.open('pms_db',1)}catch(e){return rej(e)}r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('IndexedDB error'));r.onblocked=()=>rej(new Error('IndexedDB blocked'))});

function conv(t,v,en,S){const s=String(v).trim();

 if(t==='dt'){const d=pDT(v);return d?{v:d}:{e:'tanggal/jam tidak valid ("'+s+'"); gunakan YYYY-MM-DD HH:mm'}}
 if(t==='e'){const m=en.find(x=>nk(x)===nk(s));if(m!==undefined)return{v:m};if(en===CATS||en===PGROUPS)return{v:s};return{e:'"'+s+'" tidak valid. Pilihan: '+en.join(', ')}}

 return{v:s}}

 mods.forEach(m=>XLSX.utils.book_append_sheet(wb,mk([IM[m].f.map(f=>f[1])]),IM[m].sheet));
 const ex=[['Contoh isian. Salin baris contoh ke sheet data, lalu ganti isinya.'],[]];mods.forEach(m=>{const M=IM[m];ex.push([M.sheet],M.f.map(f=>f[1]),M.f.map(f=>M.ex[f[0]]==null?'':M.ex[f[0]]),[])});XLSX.utils.book_append_sheet(wb,mk(ex),'Contoh');
 const pt=[['Modul','Kolom','Wajib','Format / nilai yang diizinkan','Keterangan']];mods.forEach(m=>IM[m].f.forEach(f=>pt.push([IM[m].sheet,f[1],f[3]?'Ya':'Tidak',fdesc(f),f[6]||''])));XLSX.utils.book_append_sheet(wb,mk(pt,30),'Petunjuk');
 dlSave((id==='all'?'template-import-semua-modul':'template-import-'+slug(IM[id].sheet))+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array'}))}
function rImport(){applyCats();const I=IMPS,rt=rep=>`<div class="tw"><table style="min-width:0"><tr><th>Sheet</th><th>Modul</th><th>Baris</th><th>Baru</th><th>Diperbarui</th><th>Dilewati</th><th>Error</th></tr>${rep.map(r=>`<tr><td>${esc(r.sheet||'')}</td><td>${esc(r.name)}</td><td>${r.total}</td><td>${r.added}</td><td>${r.updated}</td><td>${r.skipped}</td><td>${r.hdr?'<span class="bg RED">'+esc(r.hdr)+'</span>':r.errs.length?'<b style="color:var(--er)">'+r.errs.length+'</b>':0}</td></tr>`).join('')}</table></div>`;
 const unk=(I.items||[]).filter(x=>!x.mod),rep=I.res?I.res.rep:null,errs=rep?rep.flatMap(r=>r.errs.map(e=>({mod:r.name,r:e.r,msg:e.m}))):[],nOk=rep?rep.reduce((a,r)=>a+r.added+r.updated,0):0,nErr=errs.length;
 $('#ct').innerHTML=`<div class="cd" style="max-width:980px"><h3>Import Data dari Excel</h3><p style="margin:0 0 10px">Semua data bisa diisi lewat Excel: <b>(1)</b> unduh template, <b>(2)</b> isi di Excel, <b>(3)</b> upload di sini, periksa hasil, lalu terapkan. Urutan yang disarankan: <b>Master Unit</b> → <b>Parts</b> → modul lainnya (atau satu file berisi banyak sheet). Lihat tab Petunjuk Penggunaan untuk detail format.</p>
 <h3>1. Unduh template</h3><div class="ac" style="justify-content:flex-start;flex-wrap:wrap">${IM_ORDER.map(m=>`<button class="g s" onclick="impTemplate('${m}')">${IM[m].sheet}</button>`).join('')}<button class="s" onclick="impTemplate('all')">Semua modul (1 file)</button></div>
 <h3>2. Upload file</h3><div class="tb"><select onchange="IMPS.mode=this.value;IMPS.items&&impPreview()"><option value="add" ${I.mode=='add'?'selected':''}>Mode: tambah baru (lewati yang sudah ada)</option><option value="upsert" ${I.mode=='upsert'?'selected':''}>Mode: tambah + perbarui yang sudah ada</option></select><select id="impMod" onchange="IMPS.mod=this.value"><option value="auto">Modul: otomatis (dari nama sheet / judul kolom)</option>${IM_ORDER.map(m=>`<option value="${m}" ${I.mod===m?'selected':''}>${IM[m].name}</option>`).join('')}</select><button onclick="document.getElementById('impX').click()">Pilih File (.xlsx / .xls / .csv)</button><input id="impX" type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="impFile(this.files[0]);this.value=''"></div>
 <details style="margin-top:8px"><summary style="cursor:pointer;color:var(--am)">Atau tempel langsung dari Excel (copy sel termasuk baris judul)</summary><textarea id="impPaste" rows="4" placeholder="Salin sel dari Excel lalu tempel di sini (pakai modul yang dipilih di atas)"></textarea><div class="ac" style="justify-content:flex-start"><button class="g s" onclick="impPaste()">Baca data tempelan</button></div></details></div>
 ${I.done?`<div class="cd" style="max-width:980px;margin-top:12px;border-color:var(--ok)"><h3 style="color:var(--ok)">Import selesai</h3>${rt(I.done)}<div class="ac" style="justify-content:flex-start"><button class="g s" onclick="impUndo()">Urungkan import terakhir</button><small style="color:var(--mt)">Mengembalikan seluruh data ke kondisi sebelum import (berlaku sampai halaman dimuat ulang).</small></div></div>`:''}
 ${rep?`<div class="cd" style="max-width:980px;margin-top:12px"><h3>3. Hasil pemeriksaan ${esc(I.file)} · mode ${I.mode=='add'?'tambah baru':'tambah + perbarui'}</h3>${rt(rep)}${rep.filter(r=>r.ign&&r.ign.length).map(r=>`<p style="color:var(--am);margin:6px 0">Sheet ${esc(r.sheet||'')}: kolom tidak dikenali dan diabaikan: ${r.ign.map(esc).join(', ')}</p>`).join('')}${I.res&&I.res.newCats&&I.res.newCats.length?`<p style="color:var(--am);margin:6px 0">Otomatis ditambahkan ke daftar: ${I.res.newCats.map(esc).join(', ')}.</p>`:''}${I.res&&I.res.autoPM?`<p style="color:var(--mt);margin:6px 0">Jadwal PM berkala akan dibuat otomatis untuk ${I.res.autoPM} unit baru yang belum punya PM.</p>`:''}${unk.length?`<p style="color:var(--er)">Sheet tidak dikenali (lewati): ${unk.map(x=>esc(x.name)).join(', ')}. Ganti nama sheet sesuai template atau pilih modul tujuan.</p>`:''}
  ${nErr?`<h3 style="margin-top:12px;color:var(--er)">Error (${nErr}) — baris ini dilewati</h3><div class="tw"><table style="min-width:0"><tr><th>Modul</th><th>Baris Excel</th><th>Masalah</th></tr>${errs.slice(0,60).map(e=>`<tr><td>${esc(e.mod)}</td><td>${e.r}</td><td style="white-space:normal">${esc(e.msg)}</td></tr>`).join('')}</table></div>`:'<p style="color:var(--ok)">Tidak ada error.</p>'}
  <div class="ac" style="justify-content:flex-start"><button onclick="impApply()" ${nOk?'':'disabled'}>Terapkan Import (${nOk} baris)</button><button class="g" onclick="impCancel()">Batal</button></div></div>`:''}`}
// ===== PETUNJUK PENGGUNAAN =====
const GUIDE=[
['1. Mulai cepat (5 langkah)',`<ol><li>Buka <b>Dashboard</b> untuk melihat kondisi armada: KPI, grafik, dan baris "Perlu Tindakan". Atur rentang tanggal lewat <b>filter periode di header</b>.</li><li>Isi atau impor <b>Master Unit</b> (menu Master Unit atau Import Excel). Semua modul lain bergantung pada unit.</li><li>Catat pemakaian harian di <b>HM/KM Log</b>. Current HM/KM unit ikut diperbarui otomatis.</li><li>Buat jadwal di <b>PM Management</b>, catat kondisi di <b>PDM</b>, dan tangani kerusakan lewat <b>Work Order</b>.</li><li>Pantau <b>Alert Center</b> dan <b>Recommendations</b>, lalu keluarkan laporan di menu <b>Reports</b>.</li></ol><p>Aplikasi pertama kali berisi <b>data demo</b> (30 unit, 12 bulan histori) agar semua halaman langsung terisi. Kosongkan lewat <b>Data Management → Clear All Data</b> bila Anda ingin mulai dari nol.</p>`],
['2. Alur data (satu model data terpusat)',`<p>Semua modul memakai data yang sama. Mengubah satu data otomatis memengaruhi modul terkait:</p><p><b>Unit → HM/KM Log → PM / PDM → Work Order → Failure → Component → Part → Inventory → Forecast → Dashboard</b></p><ul><li>HM/KM Log menambah Current HM/KM unit, yang mengubah sisa meter PM dan sisa umur komponen.</li><li>Work Order yang terbuka mengubah status unit menjadi BREAKDOWN (atau WAITING PART). Saat semua WO unit selesai, status kembali RUNNING.</li><li>Part yang di-Issue ke WO mengurangi stok dan tercatat di kolom Parts Used.</li><li>Alert, rekomendasi, forecast, dan dashboard dihitung ulang dari data setiap halaman dibuka.</li></ul>`],
['3. Fungsi setiap menu',`<div class="tw"><table style="min-width:0"><tr><th>Menu</th><th>Fungsi dan cara pakai</th></tr>
<tr><td><b>Dashboard</b></td><td>14 KPI dan 9 grafik. Klik kartu KPI untuk membuka modulnya. Availability, MTBF, dan MTTR memakai 30 hari terakhir.</td></tr>
<tr><td><b>Alert Center</b></td><td>Peringatan otomatis (merah, kuning, biru). Tiap alert punya tombol aksi langsung dan tombol Acknowledge untuk menyembunyikannya. Alert hilang sendiri saat masalah teratasi.</td></tr>
<tr><td><b>Recommendations</b></td><td>Saran berbasis aturan: siapkan PM, siapkan penggantian komponen, buat purchase request, inspeksi PDM, buat RCA, dan tindak lanjut WO yang menunggu part.</td></tr>
<tr><td><b>Master Unit</b></td><td>Tambah, ubah, hapus unit. Pilih Category: meter HM atau KM terisi otomatis. HM dan KM tidak pernah dicampur dalam perhitungan. Unit baru (input manual maupun Import Excel) otomatis mendapat jadwal PM berkala di PM Management: Excavator, Dozer, Loader 250 HM; Grader 500 HM; Mining Truck 10.000 KM; Water Truck, Fuel Truck, Light Vehicle 5.000 KM. Last PM diset ke kelipatan interval terdekat di bawah Current HM/KM. Ubah interval atau tambah jadwal lewat PM Management.</td></tr>
<tr><td><b>HM/KM Log</b></td><td>Input harian: Opening dan Closing Meter. Daily Usage = Closing − Opening. Current HM/KM unit ikut naik.</td></tr>
<tr><td><b>PM Management</b></td><td>Pilih unit dan interval (HM: 250 sampai 4000, KM: 5000 sampai 20000). Status otomatis SAFE, DUE SOON, atau OVERDUE. Kolom Due Date boleh diisi manual (opsional); bila kosong, tampil estimasi (bertanda ~) dari rata-rata pemakaian 30 hari terakhir. Klik <i>Selesai</i> untuk mencatat PM; PM berikutnya dibuat otomatis.</td></tr>
<tr><td><b>PDM Management</b></td><td>Catat pembacaan 13 parameter (oli, coolant, temperatur, getaran, baterai, dan lainnya). Status NORMAL, WARNING, atau CRITICAL dihitung dari ambang. Ada trend chart dan tombol <i>Buat WO</i>.</td></tr>
<tr><td><b>Work Order</b></td><td>Buat dan ubah WO dengan 20 field. Downtime dihitung dari Start sampai Finish.</td></tr>
<tr><td><b>WO Tracking</b></td><td>Kanban: seret kartu antar kolom (atau pakai tombol ◀ ▶ di layar sentuh). Setiap perubahan status otomatis membuat WO Log.</td></tr>
<tr><td><b>WO Log</b></td><td>Ringkasan jam &amp; persentase per status (bisa difilter WO, unit, mekanik, prioritas, status, periode; ekspor Excel) + timeline aktivitas WO (timestamp, user, aktivitas, remark). Tombol + Aktivitas untuk mencatat langkah manual. Isi nama user di Settings.</td></tr>
<tr><td><b>Pareto</b></td><td>Analisis failure dengan 9 filter. Pilih analisis: frekuensi, downtime, biaya, komponen, atau unit. Menampilkan Top 5 sampai Top 10.</td></tr>
<tr><td><b>Components</b></td><td>Umur komponen: Actual Life, Remaining Life, dan Life Achievement. Komponen yang belum dilepas memakai Current Meter dikurangi Install Meter.</td></tr>
<tr><td><b>Life Forecast</b></td><td>Prediksi tanggal penggantian: sisa umur dibagi pemakaian rata-rata harian. Status SAFE, WATCH, PLAN, URGENT. Tombol <i>Usage</i> untuk menimpa rata-rata harian.</td></tr>
<tr><td><b>Parts</b></td><td>Master part: group, supplier, lead time, harga, stok minimum, maksimum, dan safety (harus Safety ≤ Min ≤ Max).</td></tr>
<tr><td><b>Inventory</b></td><td>Tab Stok dan Transaksi. Tipe: RECEIPT, ISSUE, ADJUSTMENT, RESERVE, UNRESERVE. Current = Opening + Receipt − Issue + Adjustment. Available = Current − Reserved.</td></tr>
<tr><td><b>Forecast</b></td><td>Kebutuhan part 1, 3, 6, dan 12 bulan dan Recommended Order. Tab Open PO untuk membuat PO dan menerima barang (stok bertambah otomatis).</td></tr>
<tr><td><b>RCA</b></td><td>Root Cause Analysis dengan 5 Why, tindakan korektif dan preventif, PIC, dan due date. Bisa diisi otomatis dari WO.</td></tr>
<tr><td><b>Fleet Performance</b></td><td>PA, MA, Utilization, Reliability, MTBF, MTTR, Downtime, dan Operating Hours dengan trend harian, mingguan, bulanan, dan tahunan.</td></tr>
<tr><td><b>Reports</b></td><td>14 laporan. Pilih laporan dan periode, lalu Print, CSV, Excel (.xlsx), atau Simpan HTML.</td></tr>
<tr><td><b>Import Excel</b></td><td>Memasukkan data dari file Excel ke semua modul. Lihat bagian 6.</td></tr>
<tr><td><b>Data Management</b></td><td>Status penyimpanan, Export Backup, Import Backup, Clear All Data. Lihat bagian 10.</td></tr>
<tr><td><b>Settings</b></td><td>Jam terjadwal per hari, durasi PM, kecepatan unit KM, nama user, dan target PM Compliance.</td></tr></table></div>`],
['4. Filter periode (rentang tanggal) di header',`<p>Di bagian atas (header) terdapat pilihan periode: <b>Semua periode</b>, Hari ini, 7 hari terakhir, 30 hari terakhir, Bulan ini, Bulan lalu, Tahun ini, 12 bulan terakhir, atau <b>Kustom</b> (isi tanggal Dari dan Sampai). Tombol ✕ menghapus filter. Saat aktif, kotak filter diberi garis kuning dan pilihan Anda tersimpan (tetap ada setelah refresh).</p><p><b>Yang mengikuti filter:</b></p><ul><li><b>Dashboard:</b> Availability, MTBF, MTTR, PM Compliance, grafik tren availability, PM compliance, breakdown, Pareto Failure, Downtime by Component, dan WO Status.</li><li><b>Fleet Performance:</b> seluruh KPI, grafik, dan tabel unit memakai periode tersebut.</li><li><b>Daftar bertanggal:</b> HM/KM Log, Work Order, WO Log, PDM (termasuk trend chart), transaksi Inventory, PM yang sudah selesai, dan Pareto.</li><li><b>Reports:</b> tanggal atau rentang laporan otomatis mengikuti filter (masih bisa Anda ubah di halaman Reports).</li></ul><p><b>Yang tidak terpengaruh</b> karena menunjukkan kondisi saat ini: kartu status unit (Running, Standby, Breakdown), PDM terakhir, WO yang masih terbuka (tetap tampil di WO Tracking), PM yang belum selesai, stok, Alert Center, Recommendations, Forecast, dan Life Forecast.</p><p>Jika sebuah halaman tampak kosong, periksa dulu apakah filter periode sedang aktif.</p>`],
['5. Mengisi data: urutan yang disarankan',`<ol><li><b>Master Unit</b> (wajib pertama).</li><li><b>Parts</b> (bila memakai inventory).</li><li><b>HM/KM Log</b> (riwayat pemakaian).</li><li><b>PM Schedule</b>, <b>PDM</b>, <b>Components</b>.</li><li><b>Work Order</b>, lalu <b>Inventory</b>, <b>Purchase Order</b>, <b>Failure</b>, dan <b>RCA</b>.</li></ol><p>Alasannya: modul yang merujuk unit atau part hanya bisa diisi bila unit atau part-nya sudah ada.</p>`],
['6. Import dari Excel (langkah rinci)',`<ol><li>Buka menu <b>Import Excel</b>.</li><li>Unduh template modul yang dibutuhkan, atau <b>Semua modul (1 file)</b>. Setiap template berisi sheet data (hanya judul kolom), sheet <i>Contoh</i>, dan sheet <i>Petunjuk</i> (kolom wajib, format, nilai yang diizinkan).</li><li>Isi data di sheet data. Jangan mengubah nama kolom. Urutan kolom bebas, kolom boleh dikurangi selama kolom wajib ada.</li><li>Pilih <b>mode</b>: <i>tambah baru</i> (data yang sudah ada dilewati) atau <i>tambah + perbarui</i> (data yang sudah ada diperbarui, hanya kolom yang Anda isi).</li><li>Klik <b>Pilih File</b>. Modul dikenali dari nama sheet atau judul kolom; atau pilih modul tujuan secara manual. Anda juga bisa menempelkan sel langsung dari Excel.</li><li>Periksa tabel hasil: jumlah baris baru, diperbarui, dilewati, dan <b>daftar error beserta nomor baris Excel</b>. Baris yang error dilewati, sisanya tetap bisa diimpor.</li><li>Klik <b>Terapkan Import</b>. Data langsung tersimpan. Bila ada yang salah, klik <b>Urungkan import terakhir</b>.</li></ol>
<p><b>Format isian</b></p><ul><li><b>Tanggal:</b> YYYY-MM-DD, DD/MM/YYYY, atau sel bertipe tanggal Excel. <b>Tanggal dan jam:</b> YYYY-MM-DD HH:mm.</li><li><b>Angka:</b> boleh memakai pemisah ribuan titik atau koma (1.250.000 atau 1,250,000) dan awalan Rp.</li><li><b>Pilihan (Category, Status, Priority, dan lainnya):</b> besar kecil huruf tidak berpengaruh, tetapi harus sama dengan daftar di sheet Petunjuk.</li><li><b>Equipment Number</b> dan <b>Part Number</b> harus sudah ada di Master Unit dan Parts (impor keduanya lebih dulu, atau taruh di file yang sama).</li></ul>
<p><b>Aturan penting</b></p><ul><li>Nama sheet untuk impor banyak modul sekaligus: <i>Master Unit, Parts, HM-KM Log, PM Schedule, PDM, Work Order, Components, Inventory, Purchase Order, Failure, RCA</i>. Urutan pemrosesan otomatis mengikuti urutan ini.</li><li>HM/KM Log: Closing tidak boleh lebih kecil dari Opening; Current HM/KM unit naik mengikuti Closing tertinggi.</li><li>Inventory: Issue tidak boleh melebihi stok, Adjustment tidak boleh membuat stok negatif, Reserve tidak boleh melebihi Available. Transaksi yang persis sama dilewati agar tidak terhitung dua kali.</li><li>Purchase Order berstatus RECEIVED hanya mencatat PO; stok tidak otomatis bertambah. Untuk menambah stok, impor transaksi RECEIPT.</li><li>Work Order yang diimpor mendapat entri WO Log "Import Excel", dan status unit mengikuti WO yang masih terbuka.</li></ul>
<p><b>Error yang sering muncul</b></p><ul><li><i>unit "..." belum ada di Master Unit</i>: impor Master Unit dulu atau periksa penulisan Equipment Number.</li><li><i>Kolom wajib tidak ditemukan</i>: judul kolom diubah atau salah ketik; pakai judul dari template.</li><li><i>Kolom tidak dikenali dan diabaikan</i> (tampil di bawah tabel hasil): judul kolom tidak cocok dengan template, sehingga isinya tidak ikut diimpor. Perbaiki judulnya bila kolom itu penting.</li><li><i>tanggal tidak valid</i>: gunakan salah satu format tanggal di atas.</li><li><i>Stok tidak cukup</i>: urutkan transaksi (Receipt sebelum Issue) atau impor stok awal lebih dulu.</li></ul>`],
['7. Rumus dan definisi',`<ul><li><b>PM Compliance</b> = PM selesai tepat waktu ÷ PM terjadwal × 100. PM terjadwal = selesai + overdue + due soon. Target awal 95% (ubah di Settings).</li><li><b>Status PM:</b> OVERDUE bila sisa meter negatif atau lewat Due Date; DUE SOON bila sisa ≤ 10% interval atau Due Date ≤ 7 hari; selain itu SAFE.</li><li>Misalkan <b>W</b> = jam operasi, <b>R</b> = downtime (breakdown + maintenance; WO berjenis Replacement, PDM, atau PM ikut dihitung), <b>S</b> = standby (Scheduled − W − R).</li><li><b>Physical Availability (PA)</b> = (W+S) ÷ (W+S+R) × 100. <b>Mechanical Availability (MA)</b> = W ÷ (W+R) × 100. PA selalu ≥ MA.</li><li><b>Utilization / Use of Availability (UA)</b> = W ÷ (W+S) × 100. <b>Effective Utilization (EU)</b> = W ÷ (W+S+R) × 100. Unit KM: jam operasi = KM ÷ kecepatan rata-rata (Settings).</li><li><b>MTBF</b> = Operating Hours ÷ jumlah failure. <b>MTTR</b> = total waktu repair ÷ jumlah repair. <b>Reliability</b> = e^(−jam ÷ MTBF).</li><li><b>Actual Life</b> = Remove Meter − Install Meter (atau Current Meter − Install Meter bila belum dilepas). <b>Life Achievement</b> = Actual ÷ Standard × 100. <b>Remaining Life</b> = Standard − Actual.</li><li><b>Remaining Days</b> = Remaining Life ÷ pemakaian rata-rata harian. Status: URGENT bila sisa hari ≤ yang terbesar antara 30 hari dan lead time part; PLAN sampai 60 hari berikutnya; WATCH sampai 150 hari berikutnya; selebihnya SAFE.</li><li><b>Forecast Demand</b> = rata-rata konsumsi bulanan × periode. <b>Recommended Order</b> = Forecast Demand + Safety Stock − Current Stock − Open PO (minimum 0).</li><li><b>Status stok</b> (dari Available): CRITICAL ≤ Safety; LOW ≤ Minimum; OVERSTOCK > Maximum; selain itu SAFE.</li><li><b>Risk forecast:</b> CRITICAL, LOW STOCK, WATCH, SAFE, OVERSTOCK.</li></ul>`],
['8. Arti warna dan status',`<ul><li><span class="bg GREEN">SAFE / OK</span> aman. <span class="bg YELLOW">DUE SOON / LOW / WARNING / PLAN</span> perlu direncanakan. <span class="bg RED">OVERDUE / CRITICAL / URGENT</span> perlu tindakan segera. <span class="bg BLUE">OVERSTOCK / INFO</span> informasi.</li><li>Status unit: RUNNING, STANDBY, BREAKDOWN, PM, PDM, WAITING PART, WAITING SERVICE, DISPOSED.</li><li>Status WO: OPEN, IN PROGRESS, WAITING PART, WAITING MANPOWER, REPAIR, TESTING, COMPLETED, CLOSED.</li><li>Prioritas WO: Emergency, High, Medium, Low.</li></ul>`],
['9. Alert dan rekomendasi',`<ul><li><b>Alert Center</b> menggabungkan PM overdue, PDM critical, unit breakdown, stok kritis, komponen urgent, PM due soon, PDM warning, stok rendah, PO terlambat, RCA overdue, dan kebutuhan order forecast. Angka di ikon 🔔 pada topbar menunjukkan alert yang belum di-acknowledge.</li><li><b>Recommendations</b> memberi saran tindakan beserta fakta pendukung dan aturan pemicunya. Tombol <i>Abaikan</i> menyembunyikan satu rekomendasi.</li></ul>`],
['10. Penyimpanan data dan backup',`<ul><li>Data disimpan otomatis setiap kali Anda menyimpan perubahan. Lihat indikator di topbar: <b>✓ DATA SAVED</b> (hijau) atau <b>● GAGAL MENYIMPAN</b> (merah).</li><li>Penyimpanan berlapis: LocalStorage, IndexedDB, dan akun Anda bila tersedia. Menu <b>Data Management</b> menampilkan status tiap lapis.</li><li><b>Export Backup</b> mengunduh file JSON seluruh data. <b>Import Backup</b> memulihkannya (data saat ini diganti, setelah konfirmasi).</li><li>Lakukan Export Backup secara berkala, terutama sebelum menghapus data atau mengganti perangkat.</li><li><b>Clear All Data</b> menghapus semua data secara permanen. <b>Muat Ulang Data Demo</b> mengganti data dengan data demo.</li></ul>`],
['11. Laporan dan ekspor',`<ul><li>Pilih jenis laporan, lalu tanggal atau rentang periode. Laporan Daily, Weekly, dan Monthly memakai satu tanggal atau bulan acuan; Component Life dan Spare Part Forecast berupa posisi hari ini.</li><li><b>Print</b> mencetak isi laporan. Jika dialog cetak tidak muncul, gunakan <b>Simpan HTML</b> lalu cetak dari browser.</li><li><b>Excel (.xlsx)</b> membuat satu sheet per bagian laporan. <b>CSV</b> memakai pemisah koma; di Excel berbahasa Indonesia, gunakan versi .xlsx agar kolom tidak menumpuk.</li></ul>`],
